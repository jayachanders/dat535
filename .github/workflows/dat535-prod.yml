name: DAT535 — Production Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lab:
        description: Lab to run
        required: true
        default: all
        type: choice
        options: [all, lab2, lab3]

env:
  PYTHON_VERSION: "3.10"
  JAVA_VERSION: "11"

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flake8 black
      - run: flake8 dat535/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: black --check dat535/

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    env:
      DAT535_ENV: prod
      DAT535_OUTPUT_DIR: /tmp/spark-lab-data/prod

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install pyspark==3.5.0 findspark requests pandas

      - name: Run Production Pipeline
        working-directory: dat535
        run: |
          python run_pipeline.py ${{ github.event.inputs.lab || 'all' }} \
            --env prod \
            --output-dir $DAT535_OUTPUT_DIR

      - name: Upload Production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prod-outputs-${{ github.run_number }}
          path: /tmp/spark-lab-data/prod/
          retention-days: 30

      - name: Write pipeline summary
        run: |
          echo "## Production Pipeline Run" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lab | ${{ github.event.inputs.lab || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
